<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLOWWITHITY | Unzip to Enter</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}#scene{position:relative;height:100svh;min-height:480px;overflow:hidden;touch-action:none;background:#0a0a0c}.shop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px;background:radial-gradient(ellipse,#25232a,#0b0b0d 70%)}.shop h1{font-size:clamp(28px,8vw,66px);letter-spacing:.12em;margin:0}.eyebrow{font-size:11px;letter-spacing:.3em;color:#dca5b8}.shop p{font-size:11px;color:#aaa;letter-spacing:.18em}.tiles{display:flex;gap:10px;width:min(90vw,550px)}.tile{flex:1;height:145px;display:grid;place-content:center;background:#222226;border:1px solid #ffffff20;font-size:48px}.tile small{font-size:10px;letter-spacing:.12em}.tile:nth-child(1){color:#d9a5b9}.tile:nth-child(2){color:#c8c8cc}.tile:nth-child(3){color:#9bb5d9}.shop button{border:0;background:white;color:#111;padding:13px 20px;font-weight:800;letter-spacing:.1em}.shop .disclaimer{max-width:320px;font-size:10px;line-height:1.5;letter-spacing:0;color:#888}.photo{position:absolute;inset:0;background-image:url('https://raw.githubusercontent.com/pauldombs-maker/flowwithity-/main/B19DD834-6B8E-4F38-A4B1-2ABFE0F7777A.png');background-size:cover;background-position:center;background-repeat:no-repeat;filter:contrast(1.06)}.half{position:absolute;inset:0}.left{clip-path:polygon(0 0,50% 0,50% 100%,0 100%)}.right{clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%)}.shadow{position:absolute;inset:0;background:linear-gradient(90deg,transparent 46%,#000b 50%,transparent 54%);pointer-events:none}.pull{position:absolute;left:50%;top:24%;width:74px;height:105px;transform:translate(-50%,-30%);pointer-events:none;filter:drop-shadow(0 5px 5px #000)}.pull svg{width:100%;height:100%}.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;background:linear-gradient(#0008,transparent)}.top strong{font-size:13px;letter-spacing:.2em}.top button{border:1px solid #aaa8;background:#0008;border-radius:30px;padding:11px 13px;color:white;font-size:10px;letter-spacing:.1em}.bottom{position:absolute;left:22px;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;text-shadow:0 2px 8px #000}.bottom p{font-size:11px;letter-spacing:.25em}.bottom input{width:100%;accent-color:#e2a4b7}.bottom small{letter-spacing:.2em}.half,.pull{will-change:clip-path,top} .photo{filter:contrast(1.12) brightness(.9)}.left{filter:contrast(1.12) brightness(.86) drop-shadow(8px 0 9px #000)}.right{filter:contrast(1.12) brightness(.91) drop-shadow(-8px 0 9px #000)}.fold{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(100deg,transparent 0 24px,#ffffff08 31px,#0009 38px,transparent 60px);mix-blend-mode:screen}.edge-light{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 41%,#eee2 47%,#000e 50%,#eee2 53%,transparent 59%)}.photo{transform:translateZ(0)} </style></head><body><main id="scene"><section class="shop"><div class="eyebrow">THE FIRST DROP</div><h1>FLOWWITHITY</h1><p>WEAR THE FLOW</p><div class="tiles"><div class="tile">♟<small>PINK</small></div><div class="tile">♟<small>BLACK</small></div><div class="tile">♟<small>BLUE</small></div></div><button id="collection">SHOP COLLECTION</button><div class="disclaimer">Concept storefront. Shopify products and checkout are not connected yet.</div></section><div class="photo half left" id="left"></div><div class="photo half right" id="right"></div><div class="fold" id="fold"></div><div class="edge-light" id="edgeLight"></div><div class="shadow" id="shadow"></div><div class="pull" id="pull"><svg viewBox="0 0 100 155"><defs><linearGradient id="metal"><stop stop-color="#777"/><stop offset=".25" stop-color="#fff"/><stop offset=".65" stop-color="#bbb"/><stop offset="1" stop-color="#444"/></linearGradient></defs><rect x="37" y="2" width="26" height="38" rx="9" fill="url(#metal)" stroke="#444" stroke-width="3"/><ellipse cx="50" cy="44" rx="15" ry="21" fill="none" stroke="url(#metal)" stroke-width="9"/><path d="M12 92Q40 55 72 77Q88 83 99 63Q84 112 53 108Q29 100 12 112Z" fill="url(#metal)" stroke="#555" stroke-width="3"/><path d="M3 125Q30 92 62 115Q78 124 95 104Q80 146 49 144Q25 133 3 147Z" fill="url(#metal)" stroke="#555" stroke-width="3"/></svg></div><div class="top"><strong>FLOWWITHITY</strong><button id="skip">SKIP TO SHOP</button></div><div class="bottom"><p id="hint">↑ SWIPE UP TO UNZIP ↑</p><input id="range" type="range" min="0" max="100" value="0" aria-label="Unzip hoodie"><small id="percent">0% OPEN</small></div></main><script>(()=>{const scene=document.getElementById('scene'),left=document.getElementById('left'),right=document.getElementById('right'),shadow=document.getElementById('shadow'),pull=document.getElementById('pull'),range=document.getElementById('range'),skip=document.getElementById('skip'),hint=document.getElementById('hint'),percent=document.getElementById('percent'),fold=document.getElementById('fold'),edgeLight=document.getElementById('edgeLight');let progress=0,sy=0,sp=0,drag=false;function update(v){progress=Math.max(0,Math.min(1,v));const t=progress,tip=24+76*t,wide=48*Math.pow(t,.82);const L=[],R=[];const N=32;for(let i=0;i<=N;i++){let y=i*100/N;let u=Math.max(0,Math.min(1,(tip-y)/Math.max(1,tip)));let curved=Math.pow(u,.75);let wrinkle=Math.sin(y*.21+t*7)*1.2*t*curved;let x=50-wide*curved+wrinkle;L.push(x.toFixed(2)+'% '+y.toFixed(2)+'%');R.push((100-x).toFixed(2)+'% '+y.toFixed(2)+'%')}left.style.clipPath='polygon(0 0,'+L.join(',')+',0 100%)';right.style.clipPath='polygon(100% 0,'+R.join(',')+',100% 100%)';shadow.style.opacity=String(t*.3);fold.style.opacity=String(Math.min(.35,t*.32));edgeLight.style.opacity=String(Math.min(.22,t*.22));pull.style.top=tip+'%';pull.style.opacity=String(Math.max(0,Math.min(1,(t-.04)*6))*Math.max(0,(1-t)*3));range.value=Math.round(t*100);percent.textContent=Math.round(t*100)+'% OPEN';hint.textContent=t>.96?'WELCOME TO THE SHOP':'↑ SWIPE UP TO UNZIP ↑';skip.textContent=t>.96?'ZIP BACK UP':'SKIP TO SHOP'};range.addEventListener('input',()=>update(+range.value/100));scene.addEventListener('touchstart',e=>{if(e.target.closest('input,button'))return;sy=e.touches[0].clientY;sp=progress;drag=true},{passive:true});scene.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();update(sp+(sy-e.touches[0].clientY)/(scene.clientHeight*.7))},{passive:false});scene.addEventListener('touchend',()=>drag=false);scene.addEventListener('wheel',e=>{e.preventDefault();update(progress+e.deltaY/(scene.clientHeight*.9))},{passive:false});skip.addEventListener('click',()=>update(progress>.96?0:1));document.getElementById('collection').addEventListener('click',()=>alert('Shopify product integration is next.'));update(0)})();</script></body></html>
