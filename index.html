<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLOWWITHITY | Unzip to Enter</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#0a0a0c;color:#fff;font-family:Arial,Helvetica,sans-serif}button{cursor:pointer}#experience{position:relative;height:100svh;min-height:500px;overflow:hidden;touch-action:none;background:#08080a}.shop{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding:20px}.shop h1{font-size:clamp(28px,8vw,68px);letter-spacing:.13em;margin:0}.shop .eyebrow{color:#e5a8bc;letter-spacing:.35em;font-size:12px}.shop p{letter-spacing:.22em;font-size:12px;color:#aaa}.products{display:flex;gap:12px;width:min(92%,600px)}.product{flex:1;min-width:0;background:#222227;border:1px solid #5555;border-radius:5px;padding:22px 5px 12px}.product .garment{font-size:52px;line-height:1.2}.product small{display:block;margin-top:12px;font-size:10px;letter-spacing:1px}.product:nth-child(1){color:#e5a9bc}.product:nth-child(2){color:#c9c9d0}.product:nth-child(3){color:#8fb3d6}.shop .action{background:white;color:#111;border:0;padding:14px 24px;font-weight:800;letter-spacing:.15em;font-size:11px}.shop .note{font-size:11px;color:#888;max-width:340px;line-height:1.5}.hoodie{position:absolute;inset:0;pointer-events:none}.fabric{position:absolute;top:0;bottom:0;width:50.5%;background:radial-gradient(ellipse at 60% 28%,#343439 0%,#202024 36%,#101013 75%);box-shadow:inset 0 0 55px #0008;will-change:transform,clip-path}.fabric.left{left:0;border-right:2px solid #777}.fabric.right{right:0;border-left:2px solid #777;transform-origin:right}.texture{position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(105deg,transparent 0px,transparent 2px,#777 3px,transparent 4px)}.fabric .logo{position:absolute;top:32%;font-size:clamp(13px,3.6vw,25px);font-weight:900;letter-spacing:.12em;color:#d9d9df}.left .logo{right:22px}.right .logo{left:22px}.teeth{position:absolute;left:calc(50% - 2px);top:0;width:4px;height:100%;background:repeating-linear-gradient(to bottom,#b9b9bf 0 3px,#55555c 3px 6px);box-shadow:0 0 6px #000}.pull{position:absolute;left:50%;top:10%;transform:translate(-50%,-15%);width:31px;height:55px;filter:drop-shadow(0 4px 5px #000)}.pull svg{width:100%;height:100%}.nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px 12px;text-shadow:0 2px 9px #000}.nav strong{font-size:14px;letter-spacing:.2em}.nav button{background:#0009;border:1px solid #aaa9;color:#fff;border-radius:25px;padding:10px 13px;font-size:10px;letter-spacing:.08em}.controls{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:24px;right:24px;text-align:center;text-shadow:0 2px 10px #000}.controls p{font-size:11px;letter-spacing:.22em}.controls input{width:100%;accent-color:#dca1b4}#progress{font-size:11px;letter-spacing:2px;color:#eee}@media(prefers-reduced-motion:reduce){.fabric,.pull{transition:none}}
</style></head><body>
<main id="experience" aria-label="FLOWWITHITY zipper reveal">
<section class="shop" id="shop"><div class="eyebrow">THE FIRST DROP</div><h1>FLOWWITHITY</h1><p>WEAR THE FLOW</p><div class="products"><div class="product"><div class="garment">♟</div><small>PINK</small></div><div class="product"><div class="garment">♟</div><small>BLACK</small></div><div class="product"><div class="garment">♟</div><small>BLUE</small></div></div><button class="action" id="shopNow">SHOP COLLECTION</button><div class="note">Storefront concept. Real products, pricing and checkout will be connected through Shopify.</div></section>
<div class="hoodie" id="hoodie"><div class="fabric left" id="left"><div class="texture"></div><span class="logo">FLOW</span></div><div class="fabric right" id="right"><div class="texture"></div><span class="logo">WITHITY</span></div><div class="teeth" id="teeth"></div><div class="pull" id="pull"><svg viewBox="0 0 40 70"><rect x="12" y="1" width="16" height="21" rx="4" fill="#b7b7bf" stroke="#555"/><path d="M13 20L27 20L33 50Q20 68 7 50Z" fill="#d9d9e1" stroke="#696971" stroke-width="2"/><path d="M12 43Q20 34 28 43M12 50Q20 41 28 50" fill="none" stroke="#777" stroke-width="3"/></svg></div></div>
<header class="nav"><strong>FLOWWITHITY</strong><button id="skip">SKIP TO SHOP</button></header>
<div class="controls"><p id="hint">↑ SWIPE UP TO UNZIP ↑</p><input id="slider" type="range" min="0" max="100" value="0" aria-label="Unzip hoodie"><div id="progress">0% OPEN</div></div>
</main>
<script>
(()=>{const stage=document.getElementById('experience'),left=document.getElementById('left'),right=document.getElementById('right'),teeth=document.getElementById('teeth'),pull=document.getElementById('pull'),slider=document.getElementById('slider'),skip=document.getElementById('skip'),hint=document.getElementById('hint'),readout=document.getElementById('progress');let p=0,initialY=0,initialP=0,dragging=false;
function set(value){p=Math.max(0,Math.min(1,value));const opening=Math.max(0,(p-.03)/.97),split=opening*110,tip=8+opening*90;
left.style.clipPath='polygon(0 0,100% 0,100% 100%,0 100%)';right.style.clipPath='polygon(0 0,100% 0,100% 100%,0 100%)';
left.style.transform='translateX('+(-split)+'%)';right.style.transform='translateX('+split+'%)';
teeth.style.opacity=String(Math.max(0,1-opening*2));pull.style.top=tip+'%';pull.style.opacity=String(Math.max(0,1-(opening-.78)*5));
slider.value=Math.round(p*100);readout.textContent=Math.round(p*100)+'% OPEN';hint.textContent=p>.95?'WELCOME TO THE SHOP':'↑ SWIPE UP TO UNZIP ↑';skip.textContent=p>.95?'ZIP BACK UP':'SKIP TO SHOP';}
slider.addEventListener('input',()=>set(Number(slider.value)/100));
stage.addEventListener('touchstart',e=>{if(e.target.closest('input,button'))return;initialY=e.touches[0].clientY;initialP=p;dragging=true},{passive:true});
stage.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();set(initialP+(initialY-e.touches[0].clientY)/(stage.clientHeight*.75))},{passive:false});stage.addEventListener('touchend',()=>dragging=false);
stage.addEventListener('wheel',e=>{e.preventDefault();set(p+e.deltaY/(stage.clientHeight*1.2))},{passive:false});
skip.addEventListener('click',()=>set(p>.95?0:1));document.getElementById('shopNow').addEventListener('click',()=>alert('Shopify store integration is the next stage.'));set(0);
})();
</script></body></html>
